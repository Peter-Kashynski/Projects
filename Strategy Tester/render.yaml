# Optional Render Blueprint. You can also configure the same in the dashboard.
services:
  - type: web
    name: strategy-tester
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # timeout 0: the live event stream stays open. A short timeout kills the
    # process while that stream is running, which freezes clicks on the site.
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 0
    envVars:
      - key: STONKBOT_SESSION_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
